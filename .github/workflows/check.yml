name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run doctor
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          # Build the Worker without targeting a real database or creating resources.
          CLOUDFLARE_D1_DATABASE_ID: 00000000-0000-0000-0000-000000000000
