<text x="330" y="306" fill="#0B1B6B" font-size="56" font-weight="800" letter-spacing="-2">1<tspan fill="#FF5B45"> file</tspan></text>
<text x="330" y="340" fill="#4A5590" font-size="20">defines the Agent</text>
<text x="580" y="306" fill="#0B1B6B" font-size="56" font-weight="800" letter-spacing="-2">5</text>
<text x="580" y="340" fill="#4A5590" font-size="20">host presets</text>
</g>
<g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18">
