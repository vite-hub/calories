<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t">
<title id="t">ViteHub Calories: send a meal by photo, voice, or text and get calories and protein back</title>
<defs>
